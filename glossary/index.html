nfidential personality available in all realms for the quick transmission of important and urgent messages when it is inexpedient to utilize either the broadcast service or the reflectivity mechanism."],["Solomon","Son of David and Bathsheba."],["Solonia","The chief of the fifth order of angels, the planetary helpers, who was on duty during the time of Adam and Eve and who proclaimed Eve's default of the divine plan and requested the return of the Melchizedek receivers to Urantia."],["Soma","Ancient Aryan god."],["Son of God","All of the Paradise Sons who, in spirit and nature, if not in all attributes, are divinely perfect portraitures of the Original Son."],["Son of Man","Our own Creator Son, onetime Son of Man on earth, now the exalted sovereign of our local universe ."],["Son-fused Mortals","An Ascending Order of Mortals in the dual-origin category."],["Son-seized","The translated souls of the flowering ages of the settled spheres who do not pass through the mansion worlds or any of the earlier phases of morontia life."],["Sonarington","One of the seven sacred life spheres of the Father which orbit the innermost circuit around Paradise. It is the personal receiving world of the Eternal Son and Paradise headquarters of the accredited and approved ascending and descending Sons of God."],["Sons of God","The personal expression of the Universal Father in the sectors of time and to the children of the whirling planets of the evolving universes of space."],["sonship","Recognition of personality ancestry."],["Sonta-an","The name Fonta used for Andon meaning 'loved by mother'."],["Sonta-en","The name Andon used for Fonta meaning 'loved by father'."],["Sontad","The first of 19 children born to Andon and Fonta. Assisted by his eldest sister, he assumed leadership of the family clan when his parents died."],["Sortoria","A neighboring local system in the constellation of Noriatiadek."],["soul","The immortal self of an ascending mortal, an experiential acquirement."],["sover es","Members of the vast family of the Divine and Infinite Spirit ."],["spirit presences","One of the categories of spirit."],["spirit-born","A new orientation of personality as well as the development of a new standard of values."],["Spirit-fused","Mortals fused with the fragmentations of the premind spirit of the Third Source and Center."],["spirit-fusion","As the Universal Father fragmentizes his prepersonal Deity, so does the Infinite Spirit individuate portions of his premind spirit to indwell and actually to fuse with the evolutionary souls of the surviving mortals of the spirit-fusion series."],["Spirit-indwelt","Mortals who have powers of prevision (insight) and may visualize the future."],["spirit-mind","Mind-spirit unified by personality."],["Spiritington","One of the seven sacred life spheres of the Father which orbit the innermost Circuit around Paradise. This is the Paradise home of those high beings exclusively representative of the Infinite Spirit."],["spiritists","Jews who taught that the kingdom would be ushered in by the great judgment of God."],["spiritized","Transformed from the material levels to the spiritual ."],["spiritizing","A functional progression which gradually extends from the material to the spiritual."],["spiritual energy","A creation of The Eternal Son."],["spironga","Spirit offspring of the Bright and Morning Star and the Father Melchizedek, these dual origin beings are a stationary order who are natives of, and spirit helpers in, the local universe."],["Splandon","The name of the major sector of the superuniverse, of Orvonton to which our local universe, Nebadon, belongs. Its capital sphere is called Umajor the fifth (see Orvonton)."],["spornagia","An animal order of creatures responsible for the care and cultivation of the landscapes of the headquarters worlds in the local universe. They are the only creatures to experience actual reincarnation."],["stabilizers","These are the regulators of the morontia energy in association with the physical and spirit forces of the realm. They make possible the conversion of morontia energy into morontia material."],["Star Students","The celestial astronomers."],["star-observer colony","The star-observer colony of Uversa now numbers over one million. These astronomers come and go, though some remain for comparatively long periods."],["Stationary Sons of the Trinity","This group of Trinity Sons embraces the following personalities: 1. Trinitized Secrets of Supremacy. 2. Eternals of Days. 3. Ancients of Days. 4. Perfections of Days. 5. Recents of Days. 6. Unions of Days. 7. Faithfuls of Days. 8. Perfectors of Wisdom. 9. Divine Counselors. 10. Universal Censors."],["Stephen","First Christian martyr."],["Stoic","Stoicism was the superior philosophy of the better classes [of Hellenistic cultures]. The Stoics believed that a controlling Reason-Fate dominated all nature. They taught that the soul of man was divine."],["Stone of Scone","A surviving \"sacred stone\" fetish."],["student spirits","Spirit ascenders who continue to master new worlds while they practice at giving out to others that which they have imbibed at the experiential founts of wisdom."],["student visitors","One of the Seven Courtesy Colonies of Uversa."],["sub-Paradise","The seven superuniverses ."],["subabsolute","Evolutional levels of power-personality manifestation in the master universe."],["subbreathers","Those inhabiting a planet with an atmosphere as thin as that of our outer neighbor, Mars."],["subpersonal","A creature without personality, e.g., an animal."],["Succoth","A Perean town among those visited by the seventy evangelists; Succoth is also the name of a Jewish harvest festival, called \"Tabernacles\" in the UB."],["Sudna","A Havona Servital on record as having been embraced by the Father and translated to the status of Graduate Guide (see servital)."],["Suduanism","Jainism."],["Sumeria","An area on the Persian Gulf ."],["Sumerian-Chaldean","Groups who taught a three-in-one God concept founded on the traditions of the days of Adam and Melchizedek."],["summarizer","One of God the Supreme's indispensable qualities."],["summating","A process used by the Supreme to aggregate evolutionary experience."],["superadditive","Where the sum of two or more things is very often something more than, or something different from, predictable additive consequences ."],["superalmighty","The speculated power of the Supreme in the outer universes."],["superangel","The Brilliant Evening Stars ."],["superaphic","Of, or pertaining to, the beings and activities of the highest order of central universe ministering spirits, the supernaphim."],["superbreather","Intelligent creatures on a planet with an atmosphere similar to that of our near neighbor, Venus."],["supercitizens","Eventuated beings with absonite attributes."],["superenergy","An attribute of the Unqualified Absolute."],["superevolutional","That which is transcendental is not necessarily nondevelopmental, but it is superevolutional in the finite sense."],["superfinite","Reality, as comprehended by finite beings, is partial, relative, and shadowy. The maximum Deity reality fully comprehensible by evolutionary finite creatures is embraced within the Supreme Being. Nevertheless there are antecedent and eternal realities, superfinite realities, which are ancestral to this Supreme Deity of evolutionary time-space creatures."],["superfishes","In Satania, of the elemental types, seven per cent are water, ten per cent air, seventy per cent land, and thirteen per cent combined land-and-air types. But these modifications of early intelligent creatures are neither human fishes nor human birds. They are of the human and prehuman types, neither superfishes nor glorified birds but distinctly mortal."],["supergoodness","Truth, beauty, and goodness are correlated in the ministry of the Spirit, the grandeur of Paradise, the mercy of the Son, and the experience of the Supreme. God the Supreme is truth, beauty, and goodness, for these concepts of divinity represent finite maximums of ideational experience. The eternal sources of these triune qualities of divinity are on superfinite levels, but a creature could only conceive of such sources as supertruth, superbeauty, and supergoodness."],["superhuman","Above or beyond what is human; having a higher nature or greater powers than humans have."],["superminded","Creature mind, before acquiring the ability to recognize divinity and worship Deity, is the exclusive domain of the adjutant spirits. With the appearance of the spiritual response of the creature intellect, such created minds at once become superminded, being instantly encircuited in the spirit cycles of the local universe Mother Spirit."],["supermortal","Above or beyond what is purely mortal, having a higher nature or greater powers than mortals have."],["supernaphim","The highest order of central universe ministering spirits Created in three orders, primary (offspring of the Conjoint Actor), secondary (of origin in the Seven Master Spirits), and tertiary(of origin in the Seven Spirits of the Circuits)."],["superperson","God, as a superperson, eventuates; God, as a person, creates; God, as a preperson, fragments; and such an Adjuster fragment of himself evolves the spirit soul upon the material and mortal mind in accordance with the freewill choosing of the personality which has been bestowed upon such a mortal creature by the parental act of God as a Father."],["superpersonal","Superpersonal — as in the eventuated existences of certain absonite and associated beings."],["superpersonal spirits","We fully understand neither the nature nor the conduct of the Inspired Spirits. They may possibly belong to the category of superpersonal spirits."],["superpersonality","God is much more than a personality as personality is understood by the human mind; he is even far more than any possible concept of a superpersonality."],["superphilosophic","Mota is a superphilosophical reconciliation of divergent reality perception which is nonattainable by material personalities; it is predicated, in part, on the experience of having survived the material life of the flesh."],["superspirit","We presume to call Gravity Messengers personalities, but in reality they are superspirit beings, unlimited and boundless personalities."],["supersummative","The Trinity is a supersummative Deity reality eventuating out of the conjoining of the three Paradise Deities."],["supertime","It may be that on the upper limits of the finite, where time conjoins transcended time, there is some sort of blurring and blending of sequence. It may be that the Supreme is able to forecast his universe presence onto these supertime levels and then to a limited degree anticipate future evolution by reflecting this future forecast back to the created levels as the Immanence of the Projected Incomplete. Such phenomena may be observed wherever finite makes contact with superfinite, as in the experiences of human beings who are indwelt by Thought Adjusters that are veritable predictions of man’s future universe attainments throughout all eternity."],["supertruth","Truth, beauty, and goodness are correlated in the ministry of the Spirit, the grandeur of Paradise, the mercy of the Son, and the experience of the Supreme. God the Supreme is truth, beauty, and goodness, for these concepts of divinity represent finite maximums of ideational experience. The eternal sources of these triune qualities of divinity are on superfinite levels, but a creature could only conceive of such sources as supertruth, superbeauty, and supergoodness."],["superultimate","If we assume a cosmos-infinite — some illimitable cosmos beyond the master universe — and if we conceive that the final developments of the Absolute Trinity will take place out on such a superultimate stage of action, then it becomes possible to conjecture that the completed function of the Trinity Absolute will achieve final expression in the creations of infinity and will consummate the absolute actualization of all potentials."],["superuniverse","Your world, Urantia, is one of many similar inhabited planets which comprise the local universe of Nebadon. This universe, together with similar creations, makes up the superuniverse of Orvonton."],["Superuniverse Centers","Occupying an enormous area on the capital sphere of each of the seven superuniverses are one thousand power centers of the third order. Three currents of primary energy of ten segregations each come in to these power centers."],["superuniverse space level","You [Urantia] are following the orderly and predetermined path of the superuniverse space level. You are now passing through the very same space that your planetary system, or its predecessors, traversed ages ago."],["Superuniverse Wards","All ascenders arriving on the training worlds of the superuniverses become the wards of the Ancients of Days; they have traversed the morontia life of the local universe and are now accredited spirits."],["Supremacy","Deity functioning on the first creature-identificational level as time-space overcontrollers of the grand universe, sometimes designated the Supremacy of Deity."],["Supreme","Supreme — self-experiential and creature-Creator-unifying Deity."],["Supreme Being","God the Supreme — the actualizing or evolving God of time and space. Personal Deity associatively realizing the time-space experiential achievement of creature-Creator identity. The Supreme Being is personally experiencing the achievement of Deity unity as the evolving and experiential God of the evolutionary creatures of time and space."],["Supreme Center Supervisors","These seven co-ordinates and associates of the Supreme Power Directors are the regulators of the master energy circuits of the grand universe."],["Supreme Creator","The present functioning of divinity in the superuniverses is actively manifest in the operations of the Supreme Creators--the local universe Creator Sons and Spirits, the superuniverse Ancients of Days, and the Seven Master Spirits of Paradise. These beings constitute the first three levels of God the Sevenfold leading inward to the Universal Father."],["Supreme Decision","When any human being makes the supreme decision, when there is a real betrothal with the Adjuster, a personal guardian is immediately assigned to that soul."],["Supreme Mind","The Supreme Being is the unification of three phases of Deity reality: God the Supreme, the spiritual unification of certain finite aspects of the Paradise Trinity; the Almighty Supreme, the power unification of the grand universe Creators; and the Supreme Mind, the individual contribution of the Third Source and Center and his co-ordinates to the reality of the Supreme Being."],["Supreme Power Centers","The Supreme Power Centers distributed throughout the superuniverses number, with their associates and subordinates, upward of ten billion."],["Supreme Spirits","A group of composite origin that embraces, among others, the following orders: 1. The Seven Master Spirits of Paradise. 2. The Reflective Spirits of the Superuniverses. 3. The Creative Spirits of the Local Universes."],["Supreme-Ultimate","... the eternal Paradise Trinity is an ever-present reminder that Deity trinitization may accomplish what is otherwise nonattainable; hence do we postulate the sometime appearance of the Supreme-Ultimate and the possible trinitization-factualization of God the Absolute."],["surviving identity","The material self has personality and identity, temporal identity; the prepersonal spirit Adjuster also has identity, eternal identity. This material personality and this spirit prepersonality are capable of so uniting their creative attributes as to bring into existence the surviving identity of the immortal soul."],["surviving souls","The God-discerning mortal is able to sense the unification value of these three cosmic qualities in the evolution of the surviving soul, man’s supreme undertaking in the physical tabernacle where the moral mind collaborates with the indwelling divine spirit to dualize the immortal soul."],["Susa","Ancient city of the Summerians."],["Susanna","Chief of the first ten women evangelists."],["susatia","Dual-origin and stationary offspring of the Creator Son and the Creative Spirit, these beings are the permanent citizens of Salvington, assist in its administration, and are associated with the ascendant citizens of the local universe."],["Switzerland","Country in western Europe."],["Sychar","A city near Jacob's well."],["Syracuse","Ancient seaport city in Sicily."],["Syria","Ancient country in W Asia, including the present Syria, Lebanon, Israel, and adjacent areas."],["System Centers","One Supreme Power Center is permanently assigned to each local system. These System Centers dispatch the power circuits to the inhabited worlds of time and space."],["System Co-ordinators","Here in those unique temples at the center of the seventy radiating wings wherein are the chambers of transition similar to the resurrection halls on the initial world of reception for earth-origin mortals, the necessary changes in creature form are skillfully effected by the system co-ordinators."],["Taanach","Small village in Israel."],["Tabamantia","An agondonter finaliter who survived the experience of the first rebellion ever in the universes of time and space."],["Talmai","King of Geshur, whose daughter David married."],["Tamar","Ancestor of Mary."],["Tao","Lao-tse built directly upon the concepts of the Salem traditions when he declared Tao to be the One First Cause of all creation."],["Tarentum","Coastal city in Southern Italy."],["Tarshish","Biblical destination of Jonah on his ill-fated journey."],["Tarsus","Capital of the Roman province of Cilicia."],["Tasmania","Island to the south of Australia."],["Technical Advisers","Technical Advisers are dedicated to the work of preventing delay, facilitating progress, and counseling achievement."],["Technicians","A division of seraphim who help new ascenders adjust themselves to the new and comparatively strange environment of the morontia spheres."],["Teherma","A Persian businessman in Amathus in early A.D. 27 who, despite Simon Peter's fumbled attempts to present the gospel teachings, responded to Jesus and entered the kingdom."],["Tenskwatawa","A teacher of the Shawnee Indian Nation who in the early 1800's accurately predicted the eclipse of the sun, thereby contributing to the evolutionary process of replacing shamanic conjuring with science."],["Terah","Father of Abraham."],["tertiaphim","The second order of angelic ministering spirits of the superuniverses who are children of the Infinite Spirit. These high angels function as the staff of the Creator Son until the Bright and Morning Star is personalized."],["Thaddeus","Other name for James Alpheus."],["Thamna","Ancient city in Greece."],["Thapsacus","Ancient town along the western bank of the Euphrates river."],["Thebes","Capital of Egypt, before and after Arman."],["Third Source and Center","The Third Source and Center is known by numerous titles: the Universal Spirit, the Supreme Guide, the Conjoint Creator, the Divine Executive, the Infinite Mind, the Spirit of Spirits, the Paradise Mother Spirit, the Conjoint Actor, the Final Co-ordinator, the Omnipresent Spirit, the Absolute Intelligence, the Divine Action; and on Urantia he is sometimes confused with the cosmic mind."],["Thomas","One of the twelve apostles."],["Thomas Didymus","Thomas Didymus, a fisherman of Tarichea and onetime carpenter and stone mason of Gadara. He was selected [as an apostle] by Philip."],["Thor","Thor, the victorious commander of the armies of the north in the final battle of the Somme, became the hero of the northern white tribes and later on was revered as a god by some of them."],["Those High in Authority","The second group of the Trinitized Sons of Attainment, are all Adjuster-fused beings of mortal origin. These are the perfected mortals who have exhibited superior administrative ability and have shown extraordinary executive genius throughout their long ascending careers."],["Those without Name and Number","The remaining three orders, Mighty Messengers, Those High in Authority, and Those without name and number, are glorified ascendant mortals."],["Thoth","Wise Egyptian god."],["Thought Adjuster","Man is spiritually indwelt by a surviving thought adjuster. If such a human mind is sincerely and spiritually motivated, if such a human soul desires to know God and become like him, honestly wants to do the Father’s will, there exists no negative influence of mortal deprivation nor positive power of possible interference which can prevent such a divinely motivated soul from securely ascending to the portals of Paradise."],["Thrace","Historical and geographic area in southeast Europe."],["threefold","(1) The Universal Father achieves freewill liberation from the bonds of infinity and the fetters of eternity by the technique of trinitization, threefold Deity personalization; (2) The grand universe is the threefold Deity domain of the Trinity of Supremacy, God the Sevenfold, and the Supreme Being; (3) God is spirit in a threefold sense: He himself is spirit; in his Son he appears as spirit without qualification; in the Conjoint Actor, as spirit allied with mind."],["Tiberias","The new city which was soon to succeed Sepphoris as the capital of Galile."],["Tiberius","Emperor of Rome."],["Tibet","Plateau region in Asia, north of the Himalayas."],["tidal-gravity","Tidal-gravity, a force between space objects, will shatter the moon into small particles, when it gets too close to the earth. These particles may assemble about the world as rings of matter resembling those of Saturn or may be gradually drawn into the earth as meteors."],["Tiglath","The young man whom Jesus picked to accompany and assist him during his six-week sojourn on Mount Hermon in A.D. 25 during which Jesus completed psychic circle mastery."],["time-bound","The concept of the I AM is a philosophic concession which we make to the time-bound, space-fettered, finite mind of man, to the impossibility of creature comprehension of eternity existences. Shortsighted and time-bound mortal minds should be slow to criticize the time delays of the farseeing and all-wise administrators of universe affairs."],["time-evolving","In the time-evolving universes of space there is greater divinity attenuation, more difficult problems to be solved, and larger opportunity to acquire experience in their solution."],["time-life","Mortal identity is a transient time-life condition in the universe; it is real only in so far as the personality elects to become a continuing universe phenomenon."],["time-space-conditioned","God the Supreme and God the Ultimate, now evolving in the experiential universes, are not existential — not past eternals, only future eternals, time-space-conditioned and transcendental-conditioned eternals."],["time-space-transcended","God the Ultimate implies the attained realization of the synthesized absonite-superpersonal, time-space-transcended, and eventuated-experiential values, co-ordinated on final creative levels of Deity reality."],["timeless","The absolute level is beginningless, endless, timeless, and spaceless. This cosmos of the Infinite I AM is therefore endless, limitless, and all-inclusive — timeless, spaceless, and unqualified."],["Timothy","Companion of Paul in Corinth."],["Titus","(1) Roman conqueror of Jerusalem, (2) Nobleman of Capernaum."],["Todan","Convert at Rimmon."],["Todas","The Toda tribe of India now observes this practice of praying to no one in particular, just as did the early peoples before the times of religious consciousness."],["totalizing","This experiential power arising out of the divinity achievements of God the Sevenfold itself manifests the cohesive qualities of divinity by synthesizing—totalizing—as the almighty power of the attained experiential mastery of the evolving creations."],["training worlds","On the training worlds of the superuniverse you pass through the true spirit stages of progression and are prepared for eventual transit to Havona."],["tranosta","The transcendental energy system operating from the upper level of Paradise in connection with absonite peoples."],["transcended space","God the Ultimate — the eventuating God of supertime and transcended space."],["transcendence","Typically used in association with the terms: time, space, death, et."],["transcendence of finite limitations","The Supreme Being function as the universe approach to the transcendence of finite limitations, for he is the actual embodiment and personal epitome of all creature evolution, progression, and spiritualization."],["transcendental","God the Supreme and God the Ultimate, now evolving in the experiential universes, are not existential — not past eternals, only future eternals, time-space-conditioned and transcendental-conditioned eternals."],["transcendental beings","There is to be found on Paradise a vast host of transcendental beings whose origin is not ordinarily disclosed to the universes of time and space until they are settled in light and life."],["Transcendental Recorders","Certain other gravity traversers are personal beings, such as Gravity Messengers and Transcendental Recorders…."],["transcendentaler","EVENTUATED TRANSCENDENTAL BEINGS. There is to be found on Paradise a vast host of transcendental beings whose origin is not ordinarily disclosed to the universes of time and space until they are settled in light and life."],["transfiguration","They beheld Jesus in intimate converse with two brilliant beings clothed in the habiliments of the light of the celestial world. And Jesus’ face and form shone with the luminosity of a heavenly light."],["transfigure","He (Jesus) enters the human mind to elevate, transform, and transfigure it. It is literally true: “If any man has Christ Jesus within him, he is a new creature; old things are passing away; behold, all things are becoming new”."],["Translated Midwayers","The primary group are destined to various finaliter corps, but the secondary or Adamic midwayers are all routed for enrollment in the Mortal Corps of Finality."],["translation","Between the time of planetary death or translation and resurrection on the mansion world, mortal man gains absolutely nothing aside from experiencing the fact of survival. This experience of translation from the material life to the morontia state — fusion of the immortal soul with the indwelling Adjuster — increases in frequency commensurate with the evolutionary progress of the planet."],["triad","Aside from certain natural couplets, such as past and present, day and night, hot and cold, and male and female, man generally tends to think in triads: yesterday, today, and tomorrow; sunrise, noon, and sunset; father, mother, and child. Three cheers are given the victor. The dead are buried on the third day, and the ghost is placated by three ablutions of water."],["triata","The energy-matter systems of Havona, which are threefold in organization and are responsive to linear gravity."],["Trimurti","The supreme trinity of Hinduism."],["trinitarian","Interdependence of the three divine personalities ."],["trinitize","It is beyond the possibility of any being successfully to portray to the human mind the nature and purport of this extraordinary transaction."],["Trinitized Ambassadors","Trinity-embraced ascendant mortals of Son- or Spirit-fused nature."],["trinitized beings","Beings created by all three Paradise Deities, either as such or as the Trinity, together with the Trinitized Corps."],["Trinitized Corps","All groups of trinitized beings, revealed and unrevealed."],["Trinitized Custodians","Trinity-embraced seraphim and midwayers."],["Trinitized Secrets of Supremacy","The highest order of the Stationary Sons of the Trinity."],["Trinitized Sons","A group of composite origin which includes all beings embraced by the Paradise Trinity even though not of direct Trinity origin."],["Trinitized Sons of Attainment","Mighty Messengers, Those High in Authority, and Those without Name and Number."],["Trinitized Sons of Destiny","Beings trinitized by a finaliter and a Paradise-Havoner ."],["Trinitized Sons of Perfection","Creature-trinitized wards of the Teacher Sons, further embraced by the Paradise Trinity."],["Trinitized Sons of Selection","The Trinitized Custodians and the Trinitized Ambassadors."],["Trinitizing","A technique that produces tertiary maximums — things, meanings, and values that are neither perfect nor perfected yet are co-ordinate with both ancestral factors."],["Trinity","Trinities are truths of relationship and facts of co-ordinate Deity manifestation."],["Trinity embrace","The divine embrace of the Paradise Deities."],["Trinity embraced","Becomes a Trinitized Son."],["Trinity Teacher Sons","Beings who range the grand universe as the supernal teachers of all personalities, human and divine."],["Trinity Ultimate","The Master Architects, the grand universe Supreme Creators, and the Supreme Being ."],["Trinity-embraced","Beings having the experience of trinitization, either as a part of their origin or as an experience of Trinity embrace subsequently attained."],["Trinity-origin and Trinitized Beings","Groups of beings created by all three Paradise Deities, either as such or as the Trinity."],["Trinity-origin Beings","One of the seven grand divisions of the divine family of living beings registered on Uversa ."],["triodity","Any of several triune relationships on the level of the existential Absolutes, not including the Father, which are directly involved in the cosmic appearance of the experiential Deities (Supreme, Ultimate, and Absolute)."],["Triodity of Potentiality","(1) This triodity consists in the association of the three Absolutes of potentiality. (2) The three Absolutes of potentiality are operative on the purely eternal level of the cosmos, hence never function as such on subabsolute levels. On the descending levels of reality the triodity of potentiality is manifest with the Ultimate and upon the Supreme. The potential may fail to time-actualize with respect to a part on some subabsolute level, but never in the aggregate. The will of God does ultimately prevail, not always concerning the individual but invariably concerning the total."],["triple velocity","About 558,840 miles per second."],["Triune-origin Beings","Created by all three Paradise Deities."],["triunities","The basic association of Absolutes."],["triunity","A threefold functional aggregate unanimity."],["Troas","A city between Athens and Ephesus."],["troposphere","The lower five or six miles of the earth’s atmosphere ."],["Tubal-Cain","Son of Lamech."],["Turanians","Descendants of the Aryan conquerors of India."],["Turkestan","The region east of the southern end of the Caspian Sea, near the Kopet Dagh."],["Tut","One of the 100 corporeal members of Caligastia's staff (see Ang). Tut headed the governors of advanced tribal relations."],["Tutankhamen","Son-in-law of lkhnaton."],["Twelve Apostles","Laymen, unlearned in the lore of the rabbis and untrained in the methods of rabbinical interpretation of the Scriptures."],["Twelvefold Adjutants of the Havona Circuits","One of the groups of the Supreme Spirits, of origin in any one of the Paradise Deities or otherwise created by any one being of direct or indirect descent from the Paradise Deities."],["two-brained","The Urantian type, somewhat more imaginative, adventurous, and philosophical than the one-brained mortals but somewhat less spiritual, ethical, and worshipful than the three-brained orders."],["Tyrannus","A school in Ephesus."],["Tyre","A city closely associated with Sidon."],["Tyrus","A town in Perea."],["Ultimacy","The absonite function in the master universe tantamount to universal overcontrol and supersustenance."],["Ultimata","Energy systems disclosing response to Paradise (absolute) gravity, but not to linear gravity."],["ultimate","Self-projected and time-space-transcending Deity."],["Ultimate-Absolute","One of the progressive levels toward the completion of the cycle of reality."],["Ultimates","That which is of master universe significance and impinges on the destiny level of the completed master universe."],["ultimaton","An energy particle which is the primary unit of material existence, 100 of which combine to form a single electron. Ultimatons are not responsive to linear gravity, but are subject to Paradise gravity."],["ultrapersonal","Meanings inherent in the personality completion of God the Absolute ."],["Umajor","The architectural sphere which is the capital of Splandon, the major sector of our superuniverse of Orvonton to which Nebadon belongs. Full name is Umajor the Fifth (see Orvonton)."],["Uminor","The architectural sphere which is the capital of Ensa, the minor sector of our superuniverse of Orvonton to which Nebadon belongs. Its full name is Uminor the third (see Orvonton)."],["Unclassified Centers","The centers who function in special local situations but not on the inhabited planets."],["Unions of Days","The Paradise advisers to the rulers of the local universes."],["Universal Absolute","The unrevealed infinity-unity of the Paradise Father."],["Universal Censors","Represent the collective attitude of Deity in the domains of executive judgment — justice."],["Universal Conciliators","The traveling courts of the universes of time and space."],["Universal Father","The personality of the First Source and Center ."],["Universal Manipulator","The Third Source and Center, the ancestor of the power-control creatures and the activator of the cosmic forces of space."],["Universe","Diverse levels of creation, all unified in the plans and administration of the Architects of the Master Universe."],["Universe Aids","Beings who are engaged in specific missions for the Creator Sons."],["Universe Circuit Supervisors","Beings concerned, not with the realms of purely physical or material energy — the domain of the Universe Power Directors — but with the circuits of relative spiritual energy and with those modified circuits which are essential to the maintenance of both the highly developed spiritual beings and the morontia or transition type of intelligent creatures."],["Universe Mother Spirit","The universe representative of the Infinite Spirit."],["universe of universes","The work of God and the dwelling place of his diverse creatures."],["universe power","all forms of energy which, while still responding to Paradise gravity, are directly responsive to linear gravity."],["Universe Power Directors","Entities who are indispensable to the organization, control, and regulation of the physical energies of the grand universe."],["Univitatia","A residential order of nonreproducing beings, created by the Creator Son and Creative Spirit, who constitute the permanent population of and minister to the constellation headquarters worlds."],["Unnamed Reflectivator Liaisons of Majeston","A group of the unclassified and unrevealed orders in the Paradise classification of living beings."],["unpervaded space","The vast space reservoirs above and below Paradise."],["Unqualified Absolute","The unlimited capacity for infinity response ."],["Unqualified Supervisors of the Supreme","The personalization of time-space supremacy."],["unqualified unity","The consequence of the creative acts and the power mandates of the Paradise Trinity."],["unqualifiedly","Limited or conditioned only by volition."],["Unrevealed Ascenders","One of The Ascending Orders of origin in any two of the Paradise Deities or otherwise created by any two beings of direct or indirect descent from the Paradise Deities."],["Unrevealed Creative Agencies of the Ancients of Days","A group of the unclassified and unrevealed orders in the Paradise classification of living beings."],["Unrevealed Deity-origin Beings","A group of The Supreme Spirits, of origin in any one of the Paradise Deities or otherwise created by any one being of direct or indirect descent from the Paradise Deities."],["Unrevealed Deity-trinitized Beings","A group of the Trinity-origin and Trinitized Beings, created by all three Paradise Deities, either as such or as the Trinity, together with the Trinitized Corps, which designation refers to all groups of trinitized beings, revealed and unrevealed."],["Unrevealed Dual-origin Beings","One of the Stationary Orders of origin in any two of the Paradise Deities or otherwise created by any two beings of direct or indirect descent from the Paradise Deities."],["Unrevealed Sons of God","One of the Descending Orders of beings of origin in any two of the Paradise Deities or otherwise created by any two beings of direct or indirect descent from the Paradise Deities."],["Unrevealed Spirit-origin Beings","Members of the Family of the Infinite Spirit."],["Unrevealed Trinity-origin Beings","A group of the Trinity-origin and Trinitized Beings."],["Unrevealed Universe Aids","Members of the Descending Orders of beings of origin in any two of the Paradise Deities or otherwise created by any two beings of direct or indirect descent from the Paradise Deities."],["Urantia","The name by which our world (planet) is known in the universes (see Orvonton)."],["Uriah","Husband of Bathsheba."],["Urmia","An old Persian city on the western shores of Lake Urmia."],["Usatia","The chief of all Census Directors in Orvonton. Created by the Infinite Spirit, Census Directors register the existence (birth and death) of all will creatures in the universe of universes (see Salsatia)."],["Uversa","The architectural and headquarters world of the seventh superuniverse, Orvonton, of which our local universe, Nebadon, is a part. Those member's of the Urantia revelatory commission who were superuniverse personalities came from Uversa (see Orvonton)."],["Uzziah","16 year old king of Judah."],["value-level","An experiential reality ."],["Van","One of the 100 corporeal members of the staff of Caligastia (see Ang), headed the supreme court of tribal coordination and racial cooperation. He was one of the 40 members of the 100 who did not join the rebellion, remaining loyal to Michael's government."],["Vanite","The descendants of Van who were in turn the ancestors of the Assyrians in the regions of northern Mesopotamia near Lake Van and Mount Ararat."],["Vedas","Among the most ancient of sacred books."],["Vedic","The cult of the Aryans ."],["Veluntia","One of the largest suns in Orvonton."],["Venus","Roman goddess of fertility."],["Vergil","Roman poet."],["Veronica","Woman of Caesarea-Philippi who was healed."],["Vesta","Roman goddess of the home."],["Vevona","Chief, during Adam's time, of the souls of peace, a corps of seraphic ministers belonging to the angelic order of planetary helpers. The angel who announced to the worlds the birth of Michael as the human Jesus."],["vicegerent","One with the authority to act on another's behalf."],["Vicegerington","One of the seven sacred life spheres of the Father which orbit the innermost circuit around Paradise. This is the home sphere of those beings who take origin in the actions of the Father and the Son."],["Vilton","A tertiary Lanonandek Son now serving under Lanaforge as secretary of the Lanonandek ministry of Satania."],["Vishnu","Third member of the Hindu Trimurti."],["volitional","The power or capability of choosing; having freewill"],["Vorondadek","The second order of local universe Sons of God created by the Creator Son and the Creative Spirit. These beings, one million in number in Nebadon, are also known as 'Constellation Fathers'."],["Vorondadek Sons","A group of the Local Universe Sons of God."],["Wolvering","A local universe neighbor of Nebadon."],["Word-Son","Spirit expression of the Thought-Father."],["Xenophanes","Greek philosopher of the 6th century B.C."],["Yahweh","God of the southern Palestinian tribes."],["Zaccheus","Chief tax collector of Jericho."],["Zacharias","Father of John the Baptist."],["Zadoc","Adoptive parent of paternal ancestor of Joseph."],["Zaphon","A town in Perea."],["zealots","A strong nationalist party that proposed to bring things to a head through political revolt."],["Zebedee","Boat builder of Capernaum."],["Zebulun","A village in Galilee."],["Zechariah","Hebrew prophet."],["Zeus","Head of the Greek pantheon."],["Zone of Infinity","An unknown and unrevealed area directly underneath the location of the Trinity, in the central portion of nether Paradise."],["Zophar","Third friend of Job."],["Zoroaster","Great religious leader of the 6th century B.C."],["Zoroastrian","The teachings of Zoroaster."],["Zulus","An African tribe just evolving a religion of ghost fear and sacrifice."]];
